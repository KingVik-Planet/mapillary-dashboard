name: Mapillary Organization Imagery Collector

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Raw per-image data (data/monthly/*.jsonl, *.csv, images_master.jsonl,
      # latest_images.csv) is NOT committed to git - it's too large and grows every
      # run (GitHub hard-blocks any pushed file over 100MB). Instead it's persisted
      # between workflow runs via the Actions cache, so the collector's incremental
      # / monthly-backfill logic still has its checkpoint state and doesn't have to
      # start over each day. Cache keys include the run id (always unique, so a
      # fresh cache is always saved), with restore-keys falling back to the most
      # recent matching entry.
      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: |
            data/monthly/*.jsonl
            data/monthly/*.csv
            data/images_master.jsonl
            data/latest_images.csv
          key: mapillary-raw-data-${{ github.run_id }}
          restore-keys: |
            mapillary-raw-data-

      - name: Run Mapillary collector
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          MAPILLARY_ORG_ID: ${{ secrets.MAPILLARY_ORG_ID }}
        run: python src/collect.py

      # Split the raw CSVs into GitHub-safe chunks (each part capped well under
      # GitHub's 50MB warning / 100MB hard limit) so the actual data is visible
      # and browsable in the repo, e.g. data/monthly_chunks/2026-05_1.csv,
      # 2026-05_2.csv, 2026-05_3.csv... Regenerated fresh every run - stale parts
      # from a previous run are automatically cleaned up.
      - name: Export CSV data as GitHub-safe chunks
        run: |
          python src/export_chunks.py --src data/monthly --out data/monthly_chunks --max-mb 40
          if [ -f data/latest_images.csv ]; then
            python src/export_chunks.py --src data/latest_images.csv --out data/latest_images_chunks --max-mb 40
          fi

      # Small aggregate outputs (data/latest.json, data/history/*.json,
      # data/monthly/*.done checkpoint markers) plus the chunked CSV exports -
      # these all stay under GitHub's size limits, so they're safe to commit.
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history/ data/monthly/*.done \
                  data/monthly_chunks/ data/latest_images_chunks/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update Mapillary imagery data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      # Optional: publish the full raw dataset (the CSV your data/latest_images.csv
      # holds) as a downloadable Release asset. Release assets allow files up to 2GB
      # and don't touch git history or repo size at all, so this is a safe place to
      # keep/download the complete dataset without it ever hitting the 100MB push
      # limit. Overwrites the same "latest-data" release each run.
      - name: Publish raw dataset as a Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/latest_images.csv ]; then
            gh release view latest-data >/dev/null 2>&1 || \
              gh release create latest-data --title "Latest Mapillary data" \
                --notes "Auto-updated by the daily collector run. Not a code release - just a stable download location for the full dataset."
            gh release upload latest-data data/latest_images.csv --clobber
          fi
